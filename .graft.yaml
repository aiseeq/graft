schema: 1
# The gate runs the race-free short tests of a large tool: about 2 minutes by median.
limits: {gate: 2m}
version:
  mode: git-tag
gate:
  - task: smoke

# go fix -diff ./... after go vet: a rewrite go fix would make fails the gate.
go_fix: {enabled: true}

# Tests of the flags SQL adapter run against this container; graft passes
# its DSN to test_db tasks. A unix socket: no network device per container.
test_db:
  image: postgres:18-alpine
  container: graft-test-pg
  socket: true
  database: graft
  user: graft
  password: graft
  dsn_var: GRAFT_TEST_PG_DSN

tools:
  glint:
    go_install: github.com/aiseeq/glint/cmd/glint
    check: [glint, rules]
    expect: python-file

tasks:
  build:
    desc: build the binary into bin/
    run:
      - [go, build, -ldflags, '-X main.buildVersion=${GRAFT_VERSION}', -o, bin/graft, .]
  pilot-gate:
    desc: run the pilot gate with the already built bin/graft
    usage: '[--no-pilot]'
    dotenv: ['GRAFT_PILOT?']
    run:
      - sh: 'sh scripts/pilot-gate.sh "$PWD/bin" {args}'
  install:
    desc: install bin/graft into tools.bin_dir (a running graft keeps its file) once the gate of the pilot passes with the new binary
    usage: '[--no-pilot]'
    deps: [build, glint, test-scenarios]
    # The pilot is a project of the user's whose gate the new binary runs
    # before it replaces the one every project's hooks run: GRAFT_PILOT in
    # .env, a path outside this repository. Run from HEAD in a disposable
    # worktree so the owner's edits and the pilot's tracked files stay alone.
    # Copy .env because it is ignored and may hold gate configuration; retain
    # GOWORK from the pilot so external workspace modules remain available.
    dotenv: ['GRAFT_PILOT?']
    run:
      - sh: '"$PWD/bin/graft" pilot-gate -- {args}'
      - install: bin/graft
      - sh: '"$PWD/bin/graft" init --global'
  fmt:
    desc: format the code
    run: [gofmt -w .]
  fmt-check:
    desc: fail on unformatted code
    run:
      - sh: 'out=$(gofmt -l .); test -z "$out" || { echo "not formatted, run graft fmt:"; echo "$out"; exit 1; }'
  vet:
    desc: go vet for the host and Windows
    run:
      - go vet ./...
      - task: vet-windows
  vet-windows:
    env: {GOOS: windows}
    run: [go vet ./...]
  test:
    desc: all tests, the PostgreSQL and docker ones included
    usage: <go test flags>
    test_db: true
    heavy: true
    tests: go
    env: {GRAFT_TEST_DOCKER: '1'}
    run: ['go test -json -p {threads} -count=1 {args} ./...']
  test-race:
    desc: all tests with the race detector
    test_db: true
    heavy: true
    tests: go
    env: {GRAFT_TEST_DOCKER: '1'}
    run: ['go test -json -p {threads} -race -count=1 ./...']
  test-gate:
    desc: the gate's tests, all but the ones that create docker containers, run the go command against modules, wait on purpose or play the release, freeze, deploy, worktree and remote host scenarios (test-race in all runs those); the PostgreSQL ones skip here and run in test-gate-db
    # They pass on the user's remote_heavy host too (01.11: go test -short on
    # it green but one test of this machine's SELinux, fixed): a busy gate
    # may send them there.
    # GATE_SCENARIOS: the root package's scenarios a commit does not use, most
    # of its time (04.11, limit 60 s). test-scenarios runs them for install,
    # test-race for all. The gate's own tests, TestBusyGate, stay here.
    env: &gate-scenarios {GATE_SCENARIOS: '^Test(Freeze|Frozen|Release|Deploy|Worktree|Remote|UserRemoteHeavy|Round|Withheld|Advisory)'}
    remote: true
    heavy: true
    tests: go
    run:
      - [go, test, -json, -p, '{threads}', -short, -skip, '${GATE_SCENARIOS}', ./...]
  test-scenarios:
    desc: the root package's scenarios test-gate leaves out, so install does not take a commit whose scenarios nobody ran
    env: *gate-scenarios
    remote: true
    heavy: true
    tests: go
    run:
      - [go, test, -json, -p, '{threads}', -short, -run, '${GATE_SCENARIOS}', .]
  test-gate-db:
    desc: the gate's tests on the test database, the packages that read GRAFT_TEST_PG_DSN
    test_db: true
    heavy: true
    tests: go
    run: ['go test -json -p {threads} -short ./internal/flags/ ./internal/testdb/ ./testdb/']
  smoke:
    desc: the commit gate
    run: [{task: fmt-check}, {task: vet}, {task: glint}, {task: test-gate}, {task: test-gate-db}]
  glint:
    desc: static analysis
    heavy: true
    # A busy gate sends glint check to the remote_heavy host when the glint
    # here is the copy install recorded there (hosts.json).
    remote: true
    run: [glint check ./...]
  all:
    desc: everything, before install
    # The gate itself, not only its task: go vet in every module and go fix
    # are steps of the gate, so a green all is a gate a commit passes.
    run: ['go run . gate', {task: test-race}]
