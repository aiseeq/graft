schema: 1
version:
  mode: git-tag
gate:
  - task: smoke

# go fix -diff ./... after go vet: a rewrite go fix would make fails the gate.
go_fix: {enabled: true}

# Tests of the flags SQL adapter run against this container; graft passes
# its DSN to test_db tasks. A unix socket: no network device per container.
test_db:
  image: postgres:18-alpine
  container: graft-test-pg
  socket: true
  database: graft
  user: graft
  password: graft
  dsn_var: GRAFT_TEST_PG_DSN

tools:
  glint:
    go_install: github.com/aiseeq/glint/cmd/glint
    check: [glint, rules]
    expect: python-file

tasks:
  build:
    desc: build the binary into bin/
    run:
      - [go, build, -ldflags, '-X main.buildVersion=${GRAFT_VERSION}', -o, bin/graft, .]
  install:
    desc: install bin/graft into tools.bin_dir (a running graft keeps its file) once the gate of the pilot passes with the new binary
    usage: '[--no-pilot]'
    deps: [build, glint]
    # The pilot is a project of the user's whose gate the new binary runs
    # before it replaces the one every project's hooks run: GRAFT_PILOT in
    # .env, a path outside this repository.
    dotenv: ['GRAFT_PILOT?']
    run:
      - sh: |
          set -eu
          set -- {args}
          if [ "$*" = --no-pilot ]; then
            echo "install: no pilot, as asked"
          elif [ $# -gt 0 ]; then
            echo "install: unknown arguments: $*; the one there is: --no-pilot" >&2
            exit 2
          elif [ -z "${GRAFT_PILOT:-}" ]; then
            echo "install: no pilot: set GRAFT_PILOT in .env to a project whose gate the new graft passes first, or install -- --no-pilot" >&2
            exit 1
          else
            new="$PWD/bin"
            echo "install: the gate of the pilot $GRAFT_PILOT with the new graft"
            if ! (cd "$GRAFT_PILOT" && PATH="$new:$PATH" "$new/graft" gate); then
              echo "install: refused: the gate of the pilot $GRAFT_PILOT failed with the new graft; ~/bin/graft is left as it was (install -- --no-pilot skips the pilot)" >&2
              exit 1
            fi
          fi
      - install: bin/graft
  fmt:
    desc: format the code
    run: [gofmt -w .]
  fmt-check:
    desc: fail on unformatted code
    run:
      - sh: 'out=$(gofmt -l .); test -z "$out" || { echo "not formatted, run graft fmt:"; echo "$out"; exit 1; }'
  vet:
    desc: go vet for the host and Windows
    run:
      - go vet ./...
      - task: vet-windows
  vet-windows:
    env: {GOOS: windows}
    run: [go vet ./...]
  test:
    desc: all tests, the PostgreSQL and docker ones included
    usage: <go test flags>
    test_db: true
    heavy: true
    tests: go
    env: {GRAFT_TEST_DOCKER: '1'}
    run: ['go test -json -p {threads} -count=1 {args} ./...']
  test-race:
    desc: all tests with the race detector
    test_db: true
    heavy: true
    tests: go
    env: {GRAFT_TEST_DOCKER: '1'}
    run: ['go test -json -p {threads} -race -count=1 ./...']
  test-gate:
    desc: the gate's tests, all but the ones that create docker containers, run the go command against modules or wait on purpose (test-race in all runs those)
    test_db: true
    heavy: true
    tests: go
    run: ['go test -json -p {threads} -short ./...']
  smoke:
    desc: the commit gate
    run: [{task: fmt-check}, {task: vet}, {task: glint}, {task: test-gate}]
  glint:
    desc: static analysis
    heavy: true
    run: [glint check ./...]
  all:
    desc: everything, before install
    # The gate itself, not only its task: go vet in every module and go fix
    # are steps of the gate, so a green all is a gate a commit passes.
    run: ['go run . gate', {task: test-race}]
